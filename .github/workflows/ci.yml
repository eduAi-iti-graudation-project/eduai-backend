name: EduAI Backend CI

on:
  # Trigger on pushes to long-lived tracking branches
  push:
    branches:
      - main
      - dev

  # Trigger on pull requests targeting our tracking branches
  pull_request:
    branches:
      - main
      - dev

# Concurrency rules: If a teammate pushes a new commit while an older CI run on 
# the same branch/PR is still running, cancel the old run automatically!
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter Check
        run: npm run lint

      - name: Run Tests (Jest)
        run: npm run test

      - name: Build Application
        run: npm run build